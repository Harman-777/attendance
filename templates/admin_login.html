<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krono — Developer Admin Gate</title>
    <link rel="icon" type="image/svg+xml" href="/static/icons/krono-logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 70%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-box {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 6px; }
        p.sub { color: #94a3b8; font-size: 0.88rem; margin-bottom: 24px; }
        label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #a855f7; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="admin-box">
        <span class="badge">🛡️ RESTRICTED DEVELOPER ACCESS</span>
        <h1>Krono Command Center</h1>
        <p class="sub">Sign in with your master administrator credentials.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <label>Admin Username</label>
            <input type="text" name="username" required autocomplete="off" placeholder="Enter admin username">

            <label>Master Password</label>
            <input type="password" name="password" required placeholder="••••••••••••">

            <button type="submit">Unlock Admin Console →</button>
        </form>
    </div>
</body>
</html>
