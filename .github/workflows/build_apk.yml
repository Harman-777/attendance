name: Build & Deploy Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed UltraPortal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f android_app/app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore android_app/app/release.keystore \
              -alias ultraportal \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ultraportal123 \
              -keypass ultraportal123 \
              -dname "CN=Ultra Portal, OU=Mobile, O=UltraPortal, L=City, ST=State, C=IN"
          else
            echo "Release keystore found in repository."
          fi

      - name: Build Release APK with Gradle
        run: |
          cd android_app
          chmod +x gradlew
          gradle wrapper || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy Signed APK to Static Directory
        run: |
          mkdir -p static/apk
          cp android_app/app/build/outputs/apk/release/app-release.apk static/apk/UltraPortal.apk
          ls -la static/apk/UltraPortal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraPortal-Release-APK
          path: static/apk/UltraPortal.apk
          retention-days: 30

      - name: Commit & Push Compiled APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/apk/UltraPortal.apk
          if git diff --staged --quiet; then
            echo "Compiled APK unchanged. Nothing to commit."
          else
            git commit -m "chore(apk): update compiled UltraPortal.apk [skip ci]"
            git push origin main
          fi
