name: Build & Deploy Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed UltraPortal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f android_app/app/release.keystore ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore android_app/app/release.keystore \
              -alias ultraportal \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ultraportal123 \
              -keypass ultraportal123 \
              -dname "CN=Ultra Portal, OU=Mobile, O=UltraPortal, L=City, ST=State, C=IN"
          else
            echo "Release keystore found in repository."
          fi

      - name: Build Release APK with Standalone Gradle
        working-directory: android_app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Deploy Signed APK to Static Directory & Push to Main
        run: |
          mkdir -p static/apk
          cp android_app/app/build/outputs/apk/release/*.apk static/apk/UltraPortal.apk
          ls -la static/apk/UltraPortal.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static/apk/UltraPortal.apk
          git commit -m "chore: update compiled UltraPortal.apk [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraPortal-Release-APK
          path: static/apk/UltraPortal.apk
          retention-days: 30
