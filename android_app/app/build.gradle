plugins {
    id 'com.android.application'
}

android {
    namespace 'in.agclms.ultraportal'
    compileSdk 34

    defaultConfig {
        applicationId "in.agclms.ultraportal"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "ultraportal123"
            keyAlias "ultraportal"
            keyPassword "ultraportal123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure native Android SDK - zero external dependencies for fast 15s cloud build and ~1.5 MB APK
}
